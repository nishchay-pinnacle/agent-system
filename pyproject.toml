[project]
name = "agent-system"
version = "0.1.0"
description = "Local company intelligence research with persistent checkpoints"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "firecrawl-py>=4.54.0",
    "langgraph",
    "langgraph-checkpoint-sqlite",
    "markdown-it-py>=4.2.0",
    "markdownify>=1.2.3",
    "openai>=3.37.0",
    "pydantic>=2.14.1",
    "python-dotenv",
    "tiktoken>=0.14.0",
]

[dependency-groups]
dev = ["pytest", "ruff", "mypy"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_system"]

[tool.ruff]
target-version = "py313"
line-length = 88

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.mypy]
python_version = "3.13"
files = ["src/agent_system"]
disallow_untyped_defs = true
check_untyped_defs = true
warn_unused_ignores = true
no_implicit_optional = true

[tool.pytest.ini_options]
testpaths = ["tests"]

# Firecrawl 4.54.0 ships annotations without a py.typed marker. Only this SDK
# is exempt from import analysis; its responses are validated at agent.py.
[[tool.mypy.overrides]]
module = ["firecrawl", "firecrawl.*"]
ignore_missing_imports = true
